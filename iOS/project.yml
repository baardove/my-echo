name: MyEchoiOS
options:
  bundleIdPrefix: com.myecho
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "FGA3Z9LLS2"
    CODE_SIGN_STYLE: Automatic
schemes:
  MyEchoiOS:
    build:
      targets:
        MyEchoiOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  MyEchoiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myecho.ios
        PRODUCT_NAME: My Echo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: My Echo
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: My Echo
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: "My Echo discovers your Mac over local Wi-Fi to automatically sync your Hi-Fi music library, playlists, and podcasts."
        NSBonjourServices:
          - _myecho-sync._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
